<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Paytm Vision Offline</title>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f6f8f7;
        color: #13201f;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(520px, calc(100% - 32px));
        border: 1px solid #dbe6e3;
        border-radius: 8px;
        padding: 28px;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.6rem;
      }

      p {
        margin: 0;
        color: #667977;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Reconnect to sign in, choose a role, or start realtime vision features.</p>
    </main>
  </body>
</html>
